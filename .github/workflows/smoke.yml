name: smoke
on: [push, pull_request]
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    env:
      TVM_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --frozen --extra dev --extra models
      - run: uv run --locked python -m minicompiler doctor
      - run: uv run --locked pytest tests
