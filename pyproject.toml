[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-tensor-compiler"
version = "0.1.0"
description = "Experiments with TVM Relax and TensorIR"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-tvm==0.27.0.post1",
    "numpy>=1.26,<3",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
gpu = [
    "cuda-bindings==13.5.0; sys_platform == 'linux'",
    "nvidia-cuda-nvrtc==13.0.88; sys_platform == 'linux'",
]
models = [
    "torch==2.11.0",
]

[project.scripts]
minicompiler = "minicompiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["minicompiler"]
